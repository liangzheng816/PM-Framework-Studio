name: Deploy Container API

on:
  push:
    branches:
      - main
    paths:
      - 'container-api/**'
      - 'api/skills/**'
      - 'infra/container-api.*'
      - '.github/workflows/deploy-container-api.yml'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: pmstudioacr
  CONTAINER_APP_NAME: pmstudio-api
  RESOURCE_GROUP: pmstudio-rg
  IMAGE_NAME: pmstudio-api

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: container-api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: container-api

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: container-api

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          docker build \
            -f container-api/Dockerfile \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
